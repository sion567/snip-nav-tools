[package]
name = "snipnav"
version = "0.1.0"
description = "SnipNav - 本地命令速查与智能发散工具（离线桌面应用）"
edition = "2021"
default-run = "snipnav"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
arboard = "3"
chrono = "0.4"
dirs = "5"
ureq = { version = "2", features = ["json"] }

[profile.release]
strip = true
lto = "thin"
