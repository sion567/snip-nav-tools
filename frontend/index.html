<!DOCTYPE html>

<title>SnipNav · 本地命令速查</title>
<script>
  // 首帧前应用记忆的主题，避免闪烁（键名与 app.js 的 toggleTheme 保持一致）
  try {
    if (localStorage.getItem('snipnav-theme') === 'light') {
      document.documentElement.dataset.theme = 'light';
    }
  } catch (e) {}
</script>
